services:
  postgres-db:
    image: postgres:${POSTGRES_VERSION:-17}
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1}
      POSTGRES_DB: ${POSTGRES_DB:-system}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      POSTGRES_INITDB_ARGS: "--timezone=${TZ:-Asia/Ho_Chi_Minh}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - /data/backups/postgres:/backups
    ports:
      - "${POSTGRES_PORT}:5432"

  postgres-ui:
    image: dpage/pgadmin4
    container_name: postgres-ui
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@vimaru.edu.vn}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-changeme}
      PGADMIN_USER_DIR: admin_vimaru.edu.vn
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - /data/backups/postgres:/backups
      - /data/backups/postgres/.pgadmin-init.sh:/pgadmin-init.sh 
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      - postgres-db

  postgresus:
    container_name: postgresus
    image: rostislavdugin/postgresus:latest
    ports:
      - "${POSTGRESUS_PORT}:4005"
    volumes:
      - postgresus-data:/postgresus-data
      - /data/backups/postgres:/backups
    environment:
      POSTGRESUS_BACKUP_DIR: /backups
    restart: unless-stopped
    depends_on:
      - postgres-db

volumes:
  postgres-data:
  pgadmin-data:
  postgresus-data:
